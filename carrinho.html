<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho · Loja Morabeza</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="barra-info">Entrega grátis na Praia em compras a partir de 5000 CVE</div>
  <header class="cabecalho">
    <div class="contentor">
      <a class="logotipo" href="index.html"><img src="assets/img/logo.svg" alt="">Morabeza</a>
      <nav class="nav">
        <a href="index.html#produtos">Produtos</a>
        <a class="link-carrinho" href="carrinho.html">Carrinho <span id="contador-carrinho" hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="contentor">
    <!-- Passos: o cliente sabe sempre onde está -->
    <div class="passos" aria-label="Passos da compra">
      <span class="atual"><b>1</b> Carrinho</span><i></i>
      <span><b>2</b> Dados e pagamento</span><i></i>
      <span><b>3</b> Confirmação</span>
    </div>
    <h1 class="titulo-pagina">O teu carrinho</h1>
    <div class="duas-colunas">
      <div id="lista-carrinho"></div>
      <aside class="resumo" id="resumo-carrinho"></aside>
    </div>
  </main>

  <footer class="rodape">
    <div class="contentor">
      <span>Loja Morabeza · Projeto de demonstração do workshop de E-commerce · UNICV</span>
      <span>Fotografias: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></span>
    </div>
  </footer>

  <script src="js/produtos.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
